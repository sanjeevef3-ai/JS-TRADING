services:
  - type: web
    name: jyoti-trading-terminal
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHONIOENCODING
        value: utf-8
      - key: SERVER_HOST
        value: 0.0.0.0
